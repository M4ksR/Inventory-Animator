name: Python checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Syntax, imports and assets
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q main.py services

      - name: Check imports
        run: python -c "import cv2, numpy, png, flet; from PIL import Image; import main; from services.build_pipeline import create_resourcepack; print('Imports OK')"

      - name: Check required resource files
        run: python -c "from pathlib import Path; assert Path('assets/templates/inventory_overlay.png').is_file(), 'Inventory overlay is missing'; assert Path('assets/resourcepack_template').is_dir(), 'Resource pack template is missing'; print('Assets OK')"
